<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="6"/>
  
  <!-- Subtle grid lines -->
  <path d="M 80,180 L 432,180 M 80,260 L 432,260 M 80,340 L 432,340" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>
  <path d="M 160,100 L 160,420 M 256,100 L 256,420 M 352,100 L 352,420" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>

  <!-- Candlesticks in background -->
  <!-- Candle 1: Red -->
  <line x1="140" y1="210" x2="140" y2="350" stroke="#ef4444" stroke-width="4" opacity="0.7"/>
  <rect x="128" y="240" width="24" height="70" rx="3" fill="#ef4444" opacity="0.8"/>

  <!-- Candle 2: Green -->
  <line x1="210" y1="180" x2="210" y2="320" stroke="#10b981" stroke-width="4" opacity="0.7"/>
  <rect x="198" y="200" width="24" height="85" rx="3" fill="#10b981" opacity="0.8"/>

  <!-- Candle 3: Green large -->
  <line x1="280" y1="130" x2="280" y2="290" stroke="#10b981" stroke-width="4" opacity="0.7"/>
  <rect x="268" y="160" width="24" height="100" rx="3" fill="#10b981" opacity="0.8"/>

  <!-- Dynamic Glowing Trendline -->
  <path d="M 80,360 Q 150,330 200,310 T 290,210 T 380,190 T 432,130" 
        fill="none" stroke="url(#neonCyan)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
        
  <!-- Pulse Node at the peak -->
  <circle cx="432" cy="130" r="14" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="432" cy="130" r="7" fill="#ffffff"/>

  <!-- Chromebook / Modern Badge accent -->
  <g transform="translate(196, 395)">
    <rect width="120" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <circle cx="28" cy="18" r="8" fill="#38bdf8"/>
    <text x="46" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">PRO</text>
  </g>
</svg>
